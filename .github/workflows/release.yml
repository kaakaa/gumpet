# Builds gumpet for every platform it supports and publishes the archives to a
# GitHub release. Pushing a tag like v0.1.0 is all it takes.
name: release

on:
  push:
    tags:
      - "v*"
  # Lets the build be exercised without cutting a release; the release job is
  # skipped unless this ran for a tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Ebitengine's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev
      - run: go vet ./...
      - run: go test ./...

  # Windows needs no cgo — Ebitengine talks to it through purego — so it
  # cross-compiles from the Linux runner. Linux itself does need cgo, and is
  # built natively here.
  build-cross:
    name: build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows_amd64
            goos: windows
            goarch: amd64
            cgo: "0"
          - name: windows_arm64
            goos: windows
            goarch: arm64
            cgo: "0"
          - name: linux_amd64
            goos: linux
            goarch: amd64
            cgo: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Ebitengine's Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          set -euo pipefail
          mkdir -p out
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          if [ "$GOOS" = "windows" ]; then
            # -H=windowsgui keeps a console window from opening behind the pet.
            go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o out/gumpet.exe ./cmd/gumpet
            go build -trimpath -ldflags "$LDFLAGS" -o out/gumpetctl.exe ./cmd/gumpetctl
          else
            go build -trimpath -ldflags "$LDFLAGS" -o out/gumpet ./cmd/gumpet
            go build -trimpath -ldflags "$LDFLAGS" -o out/gumpetctl ./cmd/gumpetctl
          fi

      - name: Package
        run: |
          set -euo pipefail
          cp README.md README.ja.md LICENSE out/
          cp assets/gopher/NOTICE out/NOTICE-gopher
          mkdir -p dist
          NAME="gumpet_${GITHUB_REF_NAME}_${{ matrix.name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd out && zip -q -r "../dist/${NAME}.zip" .)
          else
            tar -czf "dist/${NAME}.tar.gz" -C out .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # macOS needs cgo for Metal, so it is built on a macOS runner. Both
  # architectures build there, and lipo joins them into one binary that runs
  # anywhere.
  build-macos:
    name: build darwin_universal
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build both architectures
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          for arch in arm64 amd64; do
            mkdir -p "build/$arch"
            GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" -o "build/$arch/gumpet" ./cmd/gumpet
            GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" -o "build/$arch/gumpetctl" ./cmd/gumpetctl
          done

      - name: Join them into a universal binary
        run: |
          set -euo pipefail
          mkdir -p out
          for cmd in gumpet gumpetctl; do
            lipo -create -output "out/$cmd" "build/arm64/$cmd" "build/amd64/$cmd"
            lipo -info "out/$cmd"
          done

      - name: Package
        run: |
          set -euo pipefail
          cp README.md README.ja.md LICENSE out/
          cp assets/gopher/NOTICE out/NOTICE-gopher
          mkdir -p dist
          tar -czf "dist/gumpet_${GITHUB_REF_NAME}_darwin_universal.tar.gz" -C out .

      - uses: actions/upload-artifact@v7
        with:
          name: darwin_universal
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: [build-cross, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the keyless signature: Sigstore issues a short-lived certificate
      # naming this workflow, on the strength of the job's OIDC token.
      id-token: write
    steps:
      # Only for cosign.pub, to check the key signature before publishing.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          # Pinned: the bundle format has changed between cosign releases, and
          # the updater reads it.
          cosign-release: v3.1.3

      # Two signatures over the same SHA256SUMS. The key one is what a running
      # gumpet checks before it installs an update (internal/update). The
      # keyless one names this workflow and tag, for people to check by hand
      # without trusting any key; gumpet does not read it, since verifying it
      # needs a Sigstore client that would add about 12MB to gumpet.
      - name: Sign with the release key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
            --bundle dist/SHA256SUMS.key.sigstore.json dist/SHA256SUMS

      - name: Sign with this workflow's identity
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      # Checked here, before anything is public, so that a signature gumpet
      # would refuse never reaches a release.
      - name: Verify both signatures
        run: |
          cosign verify-blob --key internal/update/cosign.pub \
            --bundle dist/SHA256SUMS.key.sigstore.json dist/SHA256SUMS
          cosign verify-blob \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*
