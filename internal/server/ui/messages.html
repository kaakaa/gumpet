<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gumpet messages</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4;
    --card: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #dedece;
    --accent: #00add8;
    --accent-ink: #ffffff;
    --shown-bg: #e6f6ec;
    --shown-ink: #16653a;
    --waiting-bg: #fdf3e0;
    --waiting-ink: #8a5a10;
    --err-bg: #fdeaea;
    --err-ink: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #202225;
      --ink: #e8e8e6;
      --muted: #9a9a97;
      --line: #34363a;
      --accent-ink: #06202a;
      --shown-bg: #16331f;
      --shown-ink: #8ddba8;
      --waiting-bg: #3a2f16;
      --waiting-ink: #e5c07b;
      --err-bg: #3a1d1d;
      --err-ink: #f3a3a3;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
          "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  nav a { color: var(--accent); text-decoration: none; font-weight: 500; }
  nav a:hover { text-decoration: underline; }

  .summary { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

  .note {
    padding: 10px 13px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    background: var(--err-bg);
    color: var(--err-ink);
    overflow-wrap: anywhere;
  }

  .inline { display: flex; gap: 8px; max-width: 340px; }
  .inline input {
    flex: 1;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }
  button {
    padding: 7px 14px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 14px;
    align-items: start;
  }
  .text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin: 0;
  }
  .when {
    grid-column: 1;
    color: var(--muted);
    font-size: 12px;
  }
  .badge {
    grid-row: 1 / span 2;
    grid-column: 2;
    align-self: center;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.shown { background: var(--shown-bg); color: var(--shown-ink); }
  .badge.waiting { background: var(--waiting-bg); color: var(--waiting-ink); }

  .empty {
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>gumpet <span>messages</span></h1>
    <nav><a href="/">Settings &rarr;</a></nav>
  </header>
  <p class="summary" id="summary">Loading&hellip;</p>

  <div class="note" id="auth" hidden>
    <p style="margin:0 0 8px">This gumpet needs a token.</p>
    <div class="inline">
      <input type="text" id="token-input" placeholder="server.token" autocomplete="off">
      <button type="button" id="token-save">Unlock</button>
    </div>
  </div>

  <div class="note" id="error" hidden></div>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>
    Nothing yet. Send something with <code>gumpetctl hello</code>.
  </div>
</main>

<script>
(function () {
  "use strict";

  var TOKEN_KEY = "gumpet-token";
  var REFRESH_MS = 3000;
  var token = "";
  try { token = sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) { token = ""; }

  var $ = function (id) { return document.getElementById(id); };
  var timer = null;

  function request(url) {
    var headers = {};
    if (token) { headers["X-Gumpet-Token"] = token; }
    return fetch(url, { headers: headers }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401) {
          var err = new Error("unauthorized");
          err.unauthorized = true;
          throw err;
        }
        if (!res.ok) { throw new Error(data.error || (res.status + " " + res.statusText)); }
        return data;
      });
    });
  }

  // ago renders a timestamp the way you actually read a log: how long ago it
  // was, with the clock time alongside it.
  function ago(iso) {
    var then = new Date(iso);
    var seconds = Math.max(0, Math.round((Date.now() - then.getTime()) / 1000));
    var rough;
    if (seconds < 10) { rough = "just now"; }
    else if (seconds < 60) { rough = seconds + "s ago"; }
    else if (seconds < 3600) { rough = Math.floor(seconds / 60) + "m ago"; }
    else if (seconds < 86400) { rough = Math.floor(seconds / 3600) + "h ago"; }
    else { rough = Math.floor(seconds / 86400) + "d ago"; }
    return rough + " · " + then.toLocaleTimeString();
  }

  function render(data) {
    var messages = data.messages || [];
    var list = $("list");
    list.textContent = "";

    messages.forEach(function (msg) {
      var li = document.createElement("li");

      var text = document.createElement("p");
      text.className = "text";
      // textContent, never innerHTML: these strings come from whatever sent
      // the message.
      text.textContent = msg.text;
      li.appendChild(text);

      var badge = document.createElement("span");
      badge.className = "badge " + (msg.shown_at ? "shown" : "waiting");
      badge.textContent = msg.shown_at ? "shown" : "waiting";
      li.appendChild(badge);

      var when = document.createElement("span");
      when.className = "when";
      when.textContent = msg.shown_at
        ? "received " + ago(msg.queued_at) + ", shown " + ago(msg.shown_at)
        : "received " + ago(msg.queued_at);
      li.appendChild(when);

      list.appendChild(li);
    });

    $("empty").hidden = messages.length > 0;

    var limits = data.history || {};
    var parts = [messages.length + (messages.length === 1 ? " message" : " messages")];
    if (limits.max) { parts.push("keeping up to " + limits.max); }
    if (limits.hours > 0) {
      parts.push("for " + limits.hours + (limits.hours === 1 ? " hour" : " hours"));
    } else {
      parts.push("with no time limit");
    }
    $("summary").textContent = parts.join(", ") + ". Kept in memory, so a restart clears it.";
  }

  function load() {
    return request("api/v1/messages").then(function (data) {
      $("auth").hidden = true;
      $("error").hidden = true;
      render(data);
      start();
    }).catch(function (err) {
      stop();
      if (err.unauthorized) {
        $("auth").hidden = false;
        $("summary").textContent = "Locked.";
        $("token-input").focus();
        return;
      }
      $("error").textContent = "Could not load messages: " + err.message;
      $("error").hidden = false;
      $("summary").textContent = "";
    });
  }

  function start() {
    if (timer === null) { timer = setInterval(load, REFRESH_MS); }
  }

  function stop() {
    if (timer !== null) { clearInterval(timer); timer = null; }
  }

  // Polling a hidden tab is pure waste; pick straight back up on return.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { stop(); } else { load(); }
  });

  $("token-save").addEventListener("click", function () {
    token = $("token-input").value.trim();
    try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) { /* private window */ }
    load();
  });
  $("token-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { $("token-save").click(); }
  });

  load();
})();
</script>
</body>
</html>
