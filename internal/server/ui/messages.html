<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gumpet messages</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4;
    --card: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #dedece;
    --accent: #00add8;
    --accent-ink: #ffffff;
    --shown-bg: #e6f6ec;
    --shown-ink: #16653a;
    --waiting-bg: #fdf3e0;
    --waiting-ink: #8a5a10;
    --err-bg: #fdeaea;
    --err-ink: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #202225;
      --ink: #e8e8e6;
      --muted: #9a9a97;
      --line: #34363a;
      --accent-ink: #06202a;
      --shown-bg: #16331f;
      --shown-ink: #8ddba8;
      --waiting-bg: #3a2f16;
      --waiting-ink: #e5c07b;
      --err-bg: #3a1d1d;
      --err-ink: #f3a3a3;
    }
  }

  * { box-sizing: border-box; }

  /* Anything marked hidden stays hidden, whatever else styles it. Without
     this, a class that sets display — .row is a grid, .filters a flex box —
     outranks the browser's own [hidden] rule, and the element shows anyway:
     an empty "new version" button, a path field for a pet that needs none. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
          "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  nav a { color: var(--accent); text-decoration: none; font-weight: 500; }
  nav a:hover { text-decoration: underline; }

  .summary { color: var(--muted); font-size: 13px; margin: 0 0 16px; }

  /* Two lists, one page: what was sent, and what the pet said of its own
     accord. Tabs rather than one mixed list, because the second is mostly
     headlines and would bury the first. */
  .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); margin: 0 0 14px; }
  .tabs button {
    background: none;
    color: var(--muted);
    border: 0;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 6px 0;
    margin-bottom: -1px;
    font-weight: 600;
  }
  .tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }

  /* How each feed was last read, above what the pet said from them. */
  .feeds { margin: 0 0 18px; }
  .feeds h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .feed-url {
    grid-column: 1;
    font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .feeds .failed { color: var(--err-ink); }
  .feeds button {
    grid-row: 1 / 3;
    grid-column: 2;
    align-self: start;
    background: none;
    color: var(--accent);
    border: 1px solid var(--line);
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .source {
    grid-column: 1 / -1;
    max-height: 360px;
    overflow: auto;
    margin: 6px 0 0;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .link {
    grid-column: 1;
    font-size: 13px;
    overflow-wrap: anywhere;
    color: var(--accent);
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filters input[type=search] {
    flex: 1 1 260px;
    min-width: 0;
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
  }
  .filters select {
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
  }
  .filters input:focus-visible, .filters select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  mark {
    background: #ffe9a8;
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }
  @media (prefers-color-scheme: dark) {
    mark { background: #6b5a1e; color: #ffeec2; }
  }

  .note {
    padding: 10px 13px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    background: var(--err-bg);
    color: var(--err-ink);
    overflow-wrap: anywhere;
  }

  .inline { display: flex; gap: 8px; max-width: 340px; }
  .inline input {
    flex: 1;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }
  button {
    padding: 7px 14px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 14px;
    align-items: start;
  }
  .text {
    /* Pinned, not left to flow: a remark has no badge, and without one the
       text would drift into the badge's column. */
    grid-column: 1;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin: 0;
  }
  .when {
    grid-column: 1;
    color: var(--muted);
    font-size: 12px;
  }
  .badge {
    /* All rows, however many there are: a message with a title has three. */
    grid-row: 1 / -1;
    grid-column: 2;
    align-self: center;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.shown { background: var(--shown-bg); color: var(--shown-ink); }
  .badge.waiting { background: var(--waiting-bg); color: var(--waiting-ink); }
  /* Held during quiet hours: received and kept, and deliberately not said.
     Grey, because nothing is wrong and nothing is pending. */
  .badge.held { background: var(--line); color: var(--muted); }
  /* A headline the pet had said already: faint, like the balloon draws it,
     so the new ones are what the eye lands on. */
  .badge.again { background: var(--line); color: var(--muted); }
  li.seen .text { color: var(--muted); }

  /* A message's level is shown as a stripe down its left edge rather than
     another badge: the badges already say whether the pet has said it, and two
     badges per row reads as noise. */
  li.level-success { border-left: 3px solid var(--shown-ink); }
  li.level-warn { border-left: 3px solid var(--waiting-ink); }
  li.level-error { border-left: 3px solid var(--err-ink); }

  .title {
    grid-column: 1;
    margin: 0 0 2px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--muted);
  }
  li.level-success .title { color: var(--shown-ink); }
  li.level-warn .title { color: var(--waiting-ink); }
  li.level-error .title { color: var(--err-ink); }

  .empty {
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>gumpet <span>messages</span></h1>
    <nav><a href="/">Settings &rarr;</a></nav>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-messages" aria-selected="true">Received</button>
    <button type="button" role="tab" id="tab-remarks" aria-selected="false">Said by the pet</button>
  </div>
  <section class="feeds" id="feeds" hidden>
    <h2>Feeds</h2>
    <ul id="feed-list"></ul>
  </section>
  <p class="summary" id="summary">Loading&hellip;</p>

  <div class="filters" id="filters" hidden>
    <input type="search" id="search" placeholder="Search" autocomplete="off" spellcheck="false">
    <select id="range">
      <option value="0">Any time</option>
      <option value="600">Last 10 minutes</option>
      <option value="3600">Last hour</option>
      <option value="21600">Last 6 hours</option>
      <option value="86400">Last 24 hours</option>
      <option value="259200">Last 3 days</option>
    </select>
  </div>

  <div class="note" id="auth" hidden>
    <p style="margin:0 0 8px">This gumpet needs a token.</p>
    <div class="inline">
      <input type="text" id="token-input" placeholder="server.token" autocomplete="off">
      <button type="button" id="token-save">Unlock</button>
    </div>
  </div>

  <div class="note" id="error" hidden></div>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>
</main>

<script>
(function () {
  "use strict";

  var TOKEN_KEY = "gumpet-token";
  var REFRESH_MS = 3000;
  var token = "";
  try { token = sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) { token = ""; }

  var $ = function (id) { return document.getElementById(id); };
  var timer = null;
  // The last thing the server told us, kept so that typing in the search box
  // filters what is already here rather than waiting on a round trip.
  var latest = null;
  // Which list is showing. It lives in the address as #said so that the list
  // of remarks can be linked to and survives a reload.
  var view = location.hash === "#said" ? "remarks" : "messages";

  function request(url) {
    var headers = {};
    if (token) { headers["X-Gumpet-Token"] = token; }
    return fetch(url, { headers: headers }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401) {
          var err = new Error("unauthorized");
          err.unauthorized = true;
          throw err;
        }
        if (!res.ok) { throw new Error(data.error || (res.status + " " + res.statusText)); }
        return data;
      });
    });
  }

  // ago renders a timestamp the way you actually read a log: how long ago it
  // was, with the clock time alongside it.
  function ago(iso) {
    var then = new Date(iso);
    var seconds = Math.max(0, Math.round((Date.now() - then.getTime()) / 1000));
    var rough;
    if (seconds < 10) { rough = "just now"; }
    else if (seconds < 60) { rough = seconds + "s ago"; }
    else if (seconds < 3600) { rough = Math.floor(seconds / 60) + "m ago"; }
    else if (seconds < 86400) { rough = Math.floor(seconds / 3600) + "h ago"; }
    else { rough = Math.floor(seconds / 86400) + "d ago"; }
    return rough + " · " + then.toLocaleTimeString();
  }

  // matching narrows the list to what the search box and the time range allow.
  function matching(messages) {
    var query = $("search").value.trim().toLowerCase();
    var seconds = parseInt($("range").value, 10) || 0;
    var cutoff = seconds > 0 ? Date.now() - seconds * 1000 : 0;

    return messages.filter(function (msg) {
      if (cutoff > 0 && new Date(msg.queued_at).getTime() < cutoff) { return false; }
      if (query === "") { return true; }
      // The title is part of the message as far as anyone reading the page is
      // concerned, so searching for "CI" should find the ones labelled CI.
      return msg.text.toLowerCase().indexOf(query) >= 0 ||
        (msg.title || "").toLowerCase().indexOf(query) >= 0 ||
        (msg.link || "").toLowerCase().indexOf(query) >= 0;
    });
  }

  // fillHighlighted writes text into el, wrapping each match in a <mark>.
  // Everything goes in as a text node: these strings come from whatever sent
  // the message, and must never be parsed as markup.
  function fillHighlighted(el, text, query) {
    if (query === "") {
      el.textContent = text;
      return;
    }
    var haystack = text.toLowerCase();
    var from = 0;
    for (;;) {
      var at = haystack.indexOf(query, from);
      if (at < 0) { break; }
      el.appendChild(document.createTextNode(text.slice(from, at)));
      var hit = document.createElement("mark");
      hit.textContent = text.slice(at, at + query.length);
      el.appendChild(hit);
      from = at + query.length;
    }
    el.appendChild(document.createTextNode(text.slice(from)));
  }

  // The feeds block: how each configured feed was last read, and what it
  // served. It is rebuilt only when a report changes — the page refreshes
  // every few seconds, and rebuilding would close a source someone is in the
  // middle of reading — and in between only the times are brought up to date.
  var feedsData = null;
  var feedsBuiltFrom = "";
  var feedRows = [];
  // Sources opened, by URL, so that a rebuild opens them again.
  var openSources = {};

  function size(n) {
    if (n < 1024) { return n + " B"; }
    if (n < 1024 * 1024) { return Math.round(n / 1024) + " KB"; }
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }

  function describe(f) {
    if (!f.fetched_at) {
      return feedsData.reading
        ? "Not read yet."
        : "Not read: talking to itself is off in the settings, and feeds are only read while it is on.";
    }
    if (f.error) { return "Failed " + ago(f.fetched_at) + ": " + f.error; }
    return "Read " + ago(f.fetched_at) + " · " + f.found + (f.found === 1 ? " headline, " : " headlines, ") +
      f.recent + " recent enough to say · " + size(f.size);
  }

  function showSource(row, text) {
    var pre = row.li.querySelector(".source");
    if (!pre) {
      pre = document.createElement("pre");
      pre.className = "source";
      row.li.appendChild(pre);
    }
    // textContent, always: this is somebody else's document.
    pre.textContent = text;
    row.button.textContent = "Hide source";
  }

  function loadSource(row) {
    row.button.disabled = true;
    request("api/v1/feeds/source?url=" + encodeURIComponent(row.feed.url)).then(function (d) {
      openSources[row.feed.url] = true;
      showSource(row, d.text);
    }).catch(function (err) {
      showSource(row, "Could not load the source: " + err.message);
    }).then(function () {
      row.button.disabled = false;
    });
  }

  function renderFeeds() {
    var block = $("feeds");
    var feeds = (feedsData && feedsData.feeds) || [];
    block.hidden = view !== "remarks" || feeds.length === 0;
    if (block.hidden) { return; }

    var key = JSON.stringify(feedsData);
    if (key === feedsBuiltFrom) {
      feedRows.forEach(function (row) { row.when.textContent = describe(row.feed); });
      return;
    }
    feedsBuiltFrom = key;

    var list = $("feed-list");
    list.textContent = "";
    feedRows = feeds.map(function (f) {
      var li = document.createElement("li");
      var title = document.createElement("p");
      title.className = "title";
      title.textContent = f.name || "(no name)";
      li.appendChild(title);

      var url = document.createElement("span");
      url.className = "feed-url";
      url.textContent = f.url;
      li.appendChild(url);

      var when = document.createElement("span");
      when.className = "when" + (f.error ? " failed" : "");
      li.appendChild(when);

      var row = { feed: f, li: li, when: when, button: null };
      if (f.has_source) {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = "Source";
        button.addEventListener("click", function () {
          if (openSources[f.url]) {
            delete openSources[f.url];
            var pre = li.querySelector(".source");
            if (pre) { pre.remove(); }
            button.textContent = "Source";
            return;
          }
          loadSource(row);
        });
        li.appendChild(button);
        row.button = button;
      }
      when.textContent = describe(f);
      list.appendChild(li);
      // A source that was open is fetched again: the feed has been read
      // since, and the old text would not be what it serves now.
      if (openSources[f.url] && row.button) { loadSource(row); }
      return row;
    });
  }

  // linkTo is a feed's link, if it is one this page is prepared to offer. A
  // feed is somebody else's XML: a javascript: URL in one must not become
  // something to click.
  function linkTo(url) {
    if (!/^https?:\/\//i.test(url || "")) { return null; }
    var a = document.createElement("a");
    a.className = "link";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = url;
    return a;
  }

  function showTabs() {
    $("tab-messages").setAttribute("aria-selected", String(view === "messages"));
    $("tab-remarks").setAttribute("aria-selected", String(view === "remarks"));
  }

  function render() {
    showTabs();
    renderFeeds();
    if (latest === null) { return; }
    var remarks = view === "remarks";
    var all = latest[view] || [];
    var messages = matching(all);
    var query = $("search").value.trim().toLowerCase();

    var list = $("list");
    list.textContent = "";

    messages.forEach(function (msg) {
      var li = document.createElement("li");
      // Only the levels with a colour of their own get a class; "info" and
      // anything unrecognised are left looking ordinary.
      if (msg.level === "success" || msg.level === "warn" || msg.level === "error") {
        li.className = "level-" + msg.level;
      }

      if (msg.title) {
        var title = document.createElement("p");
        title.className = "title";
        // textContent, like everything else here: a title comes from whatever
        // sent the message and must never be parsed as markup.
        title.textContent = msg.title;
        li.appendChild(title);
      }

      var text = document.createElement("p");
      text.className = "text";
      fillHighlighted(text, msg.text, query);
      li.appendChild(text);

      if (remarks) {
        if (msg.seen) {
          li.classList.add("seen");
          var again = document.createElement("span");
          again.className = "badge again";
          again.textContent = "seen before";
          li.appendChild(again);
        }
        // The article is what a headline was for, and the balloon it came in
        // was gone in seconds.
        var link = linkTo(msg.link);
        if (link) { li.appendChild(link); }
      } else {
        // A remark is on screen the moment it is said, so "waiting" would
        // never apply and "shown" would say nothing.
        var state = msg.shown_at ? "shown" : (msg.held ? "held" : "waiting");
        var badge = document.createElement("span");
        badge.className = "badge " + state;
        badge.textContent = state;
        li.appendChild(badge);
      }

      var when = document.createElement("span");
      when.className = "when";
      if (remarks) {
        when.textContent = "said " + ago(msg.shown_at) +
          (msg.published ? ", published " + new Date(msg.published).toLocaleString() : "");
      } else {
        when.textContent = msg.shown_at
          ? "received " + ago(msg.queued_at) + ", shown " + ago(msg.shown_at)
          : msg.held
            ? "received " + ago(msg.queued_at) + ", during quiet hours"
            : "received " + ago(msg.queued_at);
      }
      li.appendChild(when);

      list.appendChild(li);
    });

    var filtered = messages.length !== all.length;
    $("empty").hidden = messages.length > 0;
    $("empty").textContent = filtered
      ? "Nothing matches."
      : remarks
        ? "Nothing yet. With \u201cTalk to itself\u201d on in the settings, what the pet says between messages is kept here."
        : "Nothing yet. Send something with gumpetctl hello.";
    $("filters").hidden = all.length === 0 && !filtered;

    var limits = latest.history || {};
    var one = remarks ? " remark" : " message";
    var many = remarks ? " remarks" : " messages";
    var counted = filtered
      ? messages.length + " of " + all.length + many
      : all.length + (all.length === 1 ? one : many);

    var parts = [counted];
    if (limits.max) { parts.push("keeping up to " + limits.max); }
    if (limits.hours > 0) {
      parts.push("for " + limits.hours + (limits.hours === 1 ? " hour" : " hours"));
    } else {
      parts.push("with no time limit");
    }
    $("summary").textContent = parts.join(", ") + ". Kept in memory, so a restart clears it.";
  }

  function load() {
    // The feeds' reports are extra: a failure there must not stop the list.
    var feeds = request("api/v1/feeds").catch(function () { return null; });
    return Promise.all([request("api/v1/messages"), feeds]).then(function (res) {
      var data = res[0];
      feedsData = res[1];
      $("auth").hidden = true;
      $("error").hidden = true;
      latest = data;
      render();
      start();
    }).catch(function (err) {
      stop();
      if (err.unauthorized) {
        $("auth").hidden = false;
        $("summary").textContent = "Locked.";
        $("token-input").focus();
        return;
      }
      $("error").textContent = "Could not load messages: " + err.message;
      $("error").hidden = false;
      $("summary").textContent = "";
    });
  }

  function start() {
    if (timer === null) { timer = setInterval(load, REFRESH_MS); }
  }

  function stop() {
    if (timer !== null) { clearInterval(timer); timer = null; }
  }

  // Polling a hidden tab is pure waste; pick straight back up on return.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { stop(); } else { load(); }
  });

  $("token-save").addEventListener("click", function () {
    token = $("token-input").value.trim();
    try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) { /* private window */ }
    load();
  });
  $("token-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { $("token-save").click(); }
  });

  // Filtering is done here rather than on the server, so it keeps up with
  // typing and the refresh below never disturbs what is in the box.
  $("search").addEventListener("input", render);
  $("range").addEventListener("change", render);

  function choose(which) {
    view = which;
    history.replaceState(null, "", which === "remarks" ? "#said" : location.pathname);
    render();
  }
  $("tab-messages").addEventListener("click", function () { choose("messages"); });
  $("tab-remarks").addEventListener("click", function () { choose("remarks"); });

  load();
})();
</script>
</body>
</html>
