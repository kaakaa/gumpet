<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gumpet messages</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/ui/common.css">
<link rel="stylesheet" href="/ui/messages.css">
</head>
<body>
<main>
  <header>
    <h1>gumpet <span>messages</span></h1>
    <nav><a href="/">Settings &rarr;</a></nav>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-messages" aria-selected="true">Received</button>
    <button type="button" role="tab" id="tab-remarks" aria-selected="false">Said by the pet</button>
  </div>
  <section class="feeds" id="feeds" hidden>
    <h2>Feeds</h2>
    <ul id="feed-list"></ul>
  </section>
  <p class="summary" id="summary">Loading&hellip;</p>

  <div class="filters" id="filters" hidden>
    <input type="search" id="search" placeholder="Search" autocomplete="off" spellcheck="false">
    <select id="range">
      <option value="0">Any time</option>
      <option value="600">Last 10 minutes</option>
      <option value="3600">Last hour</option>
      <option value="21600">Last 6 hours</option>
      <option value="86400">Last 24 hours</option>
      <option value="259200">Last 3 days</option>
    </select>
  </div>

  <div class="note" id="auth" hidden>
    <p style="margin:0 0 8px">This gumpet needs a token.</p>
    <div class="inline">
      <input type="text" id="token-input" placeholder="server.token" autocomplete="off">
      <button type="button" id="token-save">Unlock</button>
    </div>
  </div>

  <div class="note" id="error" hidden></div>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>
</main>

<script src="/ui/messages.js"></script>
</body>
</html>
